{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | University of Asia Pacific</title>

    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>

<body>
    <!-- Background decoration -->
    <div class="background" aria-hidden="true">
        <div class="grid"></div>
        <div class="planet planet-blue"></div>
        <div class="planet planet-orange"></div>
        <div class="planet planet-small-blue"></div>
        <div class="planet planet-small-orange"></div>
    </div>

    <main class="page">
        <section class="login-card" aria-labelledby="login-title">

            <header class="university">
                <!-- Decorative emblem -->
                <div class="emblem" aria-hidden="true">
                    <span class="emblem-top"></span>
                    <span class="emblem-left"></span>
                    <span class="emblem-right"></span>
                    <span class="emblem-bottom-left"></span>
                    <span class="emblem-bottom-right"></span>
                </div>

                <p>UNIVERSITY OF ASIA PACIFIC</p>
            </header>

            <h1 id="login-title">Login</h1>

            <!-- Submit credentials to the Django home view -->
            <form
                method="post"
                action="{% url 'home' %}"
                autocomplete="off"
            >
                {% csrf_token %}

                <!-- Invalid login message -->
                {% if error %}
                    <p class="error-message" role="alert">
                        {{ error }}
                    </p>
                {% endif %}

                <!-- Registration ID -->
                <div class="form-group">
                    <label for="registration-id">
                        Registration ID
                    </label>

                    <div class="input-box">
                        <svg
                            class="input-icon"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.5"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <circle cx="12" cy="7" r="4"></circle>
                            <path d="M3 22v-2a9 7 0 0 1 18 0v2H3Z"></path>
                        </svg>

                        <input
                            type="text"
                            id="registration-id"
                            name="registration_id"
                            placeholder="Enter your registration ID"
                            value="{{ request.POST.registration_id|default:'' }}"
                            autocomplete="off"
                            autocapitalize="none"
                            spellcheck="false"
                            required
                        >
                    </div>
                </div>

                <!-- Password -->
                <div class="form-group password-group">
                    <label for="password">
                        Password
                    </label>

                    <div class="input-box">
                        <svg
                            class="input-icon"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.5"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <rect
                                x="4"
                                y="10"
                                width="16"
                                height="12"
                                rx="2"
                            ></rect>

                            <path d="M7 10V6a5 5 0 0 1 10 0v4"></path>
                            <path d="M12 15v3"></path>
                        </svg>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="new-password"
                            required
                        >

                        <!-- Decorative icon, no JavaScript -->
                        <svg
                            class="eye-icon"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.5"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                        >
                            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12Z"></path>
                            <circle cx="12" cy="12" r="3.5"></circle>
                        </svg>
                    </div>
                </div>

                <!-- Connect password reset URL later -->
                <div class="forgot-password">
                    <a href="#">Forgot Password?</a>
                </div>

                <!-- Submit login form -->
                <button type="submit" class="login-button">
                    Login
                </button>

                <!-- Connect signup URL later -->
                <p class="signup-text">
                    Don't have an account?
                    <a href="#">Sign Up</a>
                </p>
            </form>
        </section>
    </main>
</body>
</html>
